<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 400px;
            width: 100%;
            background-color: lightblue;
            display: grid;
            /* create column(width) */
            /*  %, px(avoid),rem,prefered:1fr 2fr 1fr-> 1:2:1: anupat me  */
            grid-template-columns: 2fr 1fr 2fr;
            /* upr apne accroding anupat de skte he */

            /* to create/modify rows */
            grid-template-rows: 90px 100px 150px 100px 90px;   /* aisa krne row ka size increse hota jata he
           /* row & column */
           gap: 10px; /* row-gap: 10px; column-gap: 10px; */
            
            
        }
        .box{
            /* height: 100px; */
            /* width: 100px; */
            background-color: lightcoral;
            border: 1px solid black;
            text-align: center;
            font-size: 1.4rem;
            border-radius: 10px;
        }
        .box1{
            background-color: lightgreen;
            grid-column: 1/4; /* 1st column se start hoke 4th column pe end hoga */
             /* grid-column: 1/3; -> 1st column se start hoke 3rd column pe end hoga */
            grid-row: 1/2; /* 1st row se start hoke 2nd row pe end hoga */
             /* grid-row: 1/3; -> 1st row se start hoke 3rd row pe end hoga */
        }
        .box2{
            background-color: lightyellow;
            grid-column: 1/2; /* 1st column se start hoke 2nd column pe end hoga */
             /* grid-column: 1/3; -> 1st column se start hoke 3rd column pe end hoga */
            grid-row: 2/4; /* 2nd row se start hoke */
        }
        .box3{
            background-color: lightpink;
            grid-column: 2/4; /* 2nd column se start hoke 4th column pe end hoga */
             /* grid-column: 1/3; -> 1st column se start hoke 3rd column pe end hoga */
            grid-row: 2/3; /* 2nd row se start hoke 3rd row pe end hoga */
        }   
        .box4{
            background-color: lightgray;

            grid-column: 2/3; /* 2nd column se start hoke 3rd column pe end hoga */
             /* grid-column: 1/3; -> 1st column se start hoke 3rd column pe end hoga */ 
            grid-row: 3/4; /* 3rd row se start hoke 4th row pe end hoga */
             /* grid-row: 1/3; -> 1st row se start hoke 3rd row pe end hoga */
        }
        .box5{
            background-color: lightcyan;
                grid-column: 3/4; /* 3rd column se start hoke 4th column pe end hoga */
                /* grid-column: 1/3; -> 1st column se start hoke 3rd column pe end hoga */
                grid-row: 3/4; /* 3rd row se start hoke 4th row pe end hoga */
                /* grid-row: 1/3; -> 1st row se start hoke 3rd row pe end hoga */
        }
        .box6{
           background-color: lightgoldenrodyellow;
           grid-column: 1/2;
           grid-row: 4/5;
        }
        .box7{
           background-color: lightsteelblue;
              grid-column: 2/3;
                grid-row: 4/5;
        }
        .box8{
            background-color: lightseagreen;
            
                grid-column: 3/4;
                grid-row: 4/5;
        }
        .box9{
           background-color: lightcoral;
                grid-column: 1/4;
                grid-row: 5/6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">Header</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
        <div class="box box5">Box 5</div>
        <div class="box box6">Box 6</div>
        <div class="box box7">Box 7</div>
        <div class="box box8">Box 8</div>
        <div class="box box9">Footer</div>
    </div>
</body>
</html>

<!-- Grid: used to create responsivee layouts(ecommerce website,portfolio,...) 
 header, main(section),sidebar
 
 parent element- grid
 
 flex - column,row
 grid- row + column
 before grid layout was designed using table

 ending line number


 yah link he grid banane ki -> https://angrytools.com/css-grid/
 -->
