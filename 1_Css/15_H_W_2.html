<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;

        }
        body{
            background-color: black;
            font-style: Arial, Helvetica, sans-serif;
        }

        .box{
            width: 300px;
            height: 250px;
            background-color:red;
            margin: 100px auto;
            border-radius: 20px;
            border: 2px solid white;
            transition: all 0.5s ease;
            /* transition-duration: 0.5s; */
            
        }
        .box:hover{
            transform:perspective(500px) translateX(20px) translateY(-20px) rotate(20deg)  scale(1.1);
            transition: all 0.5s ease;
            box-shadow: 0px 10px 20px rgba(192, 212, 76, 0.781);
            background-color: yellow;
        }
        h3{
            
            transition: all 0.5s ease;
            color: white;
            padding-left: 20px;
            padding-top: 35%;
            text-align: center;
            font-size: 25px;
           /* transition: all 0.5s ease; */


        }
        .box:hover h3{
            color: black;
        }
        
    </style>
</head>
<body>
    <div class="box"><h3>Hover Me</h3></div>
</body>
</html>
