<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Box{
            height: 150px;
            width: 150px;
            border: 1px solid black;
            margin-bottom: 50px;
            margin-left: 50px;
            text-align: center;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 20px;
            /* display: inline-block; */

        }
        h3{
            padding-top: 30px;
        }
        .translate{
            background-color: rgb(41, 192, 192);
             transform: translateX(50px);

        }
        .rotate{
            background-color: aquamarine;
            transform: rotate(40deg);
        }
        .skew{
            background-color: purple;

            transform: skew(15deg, 5deg); 
       }
       .h:hover{
        background-color: lightgreen;
       }
    </style>

</head>
<body>
    <div class="Box translate"><h3>Translate</h3></div>
    <div class="Box rotate"><h3>Rotate</h3></div>
    <div class="Box skew"><h3>Skew</h3></div>
    <div class="Box h"><h3>Hower Me</h3></div>
</body>
</html>
