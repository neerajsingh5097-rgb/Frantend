<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
           height: 500px;
           width: 400px;
        }
         .box {
            height: 200px;
            width: 200px;
            border-radius: 10px;
            position: absolute;
            top: 100px;
            left: 100px;
            transition: all 2s ease;
            transform-origin: bottom right;
            border: 2px solid pink;  
        }
        .box1 {
            z-index: 3;
        }
        .container:hover .box1 {
            transform: rotate(50deg);
        }
        .box2 {  
            z-index: 2;
        }
        .container:hover .box2 {
            transform: rotate(40deg);
        }
        .container:hover .box3 {
            transform: rotate(30deg);
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="box box1" style="background-color: red;"></div>
    <div class="box box2" style="background-color: white" ></div>
    <div class="box box3" style="background-color: green"  ></div>
    </div>
    
</body>
</html>
