<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 150px;
            width: 150px;
            border: 2px solid;
            text-align: center;
            font-size: 18px;
            padding: 10px;
            margin: 10px;
            border-radius: 50%;
            /* iske bina move nhi krega yah dena hi padega  */
            position: relative;
            /* 1.phla animation name hota he
            2.dusara kitani second me chalana he 
            3.kitani bar chalana he
            4.smooth chalane ke liye*/
            animation: moveAnimation 4s linear  1s infinite alternate;
            /* alternate me bhi reverse alternate-reverse etc he */
        }
        @keyframes moveAnimation {
            /* 0%{
                background-color: red;
                top: 0px;
                left: 0px;
            }
            25%{
                background-color: yellow;
                top: 0px;
                left: 500px;
            }
            50%{
                background-color: aqua;
                top: 400px;
                left: 500px;
            }
            75%{
                background-color: blue;
                top: 400px;
                left: 0px;
            }
            100%{
                background-color: aquamarine;
                top: 0px;
                left: 0px;
            } */

            /* advance tarika */
            0%{
                transform: translate(0, 0);
                background-color: red;
            }
   
            100%{
                transform: translate(0px, 400px);
                background-color: greenyellow;
            }
        }
    </style>
</head>
<body>
    <div class="box">Move cricle </div>
</body>
</html>
