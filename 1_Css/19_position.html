<!-- 
Position in Css: use to change position of element/container frome one position to another
top, bottom,left,right
Type of position
1. static: default behaviour of element, normal flow of the document. It'll not change the position using top, bottom,left.right
2. relative: initially normal flow of the document but It'll change position when you applied top/bottom,left/
right properties, it'll change position from it's own position. independent
3. absolute: it'll remove from document, It'll change position according to the body if there is not a 
relative parent element.
4. fixed: element will be fixed in your viewport, navbar, footer
5. sticky: relative + fixed(fied within a parent element)
-->
