     <!-- show "mouse is moving.." while the mouse moves inside the box -->
    <div
      id="mouseBox"
      style="
        width: 150px;
        height: 150px;
        background-color: lightcoral;
        text-align: center;
        line-height: 150px;
      "
      onmousemove="this.innerHTML='Mouse is moving..';"
      onmouseout="this.innerHTML='Mouse is out of the box';"
    >
      Move your mouse here!
    </div>


    <script>
      let toggleBtn = document.getElementById("toggleBtn");
      let myImage = document.getElementById("myImage");

      toggleBtn.addEventListener("click", () => {  // function () write now this type of function is called anonymous function
        if (myImage.style.display === "none") {
          myImage.style.display = "block";
        } else {
          myImage.style.display = "none";

        }
      });
    //   =================================================================================================
        let hoverBox = document.getElementById("hoverBox");
        hoverBox.addEventListener("mouseover", () => {
            hoverBox.style.backgroundColor = "lightgreen";
        });
        hoverBox.addEventListener("mouseout", () => {
            hoverBox.style.backgroundColor = "skyblue";
        });
